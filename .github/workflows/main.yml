name: RDP-24-7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'  # كل 5 ساعات - إعادة تشغيل تلقائية

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 330  # 5.5 ساعة (قبل الحد الأقصى 6 ساعات)

    steps:
      - name: Configure Core RDP Settings
        run: |
          # فعّل Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # حذف القواعس القديمة وإضافة قاعدة جديدة
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # إعادة تشغيل خدمة RDP
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          # إنشاء المستخدم (تجاهل الخطأ لو كان موجود)
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          
          echo "RDP_CREDS=$password" >> $env:GITHUB_ENV
          
          Write-Host "✅ User RDP created successfully"

      - name: Install Tailscale
        run: |
          # تحقق لو كان مثبت
          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
              $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
              $installerPath = "$env:TEMP\tailscale.msi"
              
              Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
              Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
              Remove-Item $installerPath -Force
              Start-Sleep -Seconds 5
              Write-Host "✅ Tailscale installed"
          } else {
              Write-Host "✅ Tailscale already installed"
          }

      - name: Establish Tailscale Connection (IP ثابت)
        run: |
          # استخدم hostname ثابت = IP ثابت
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-rdp-permanent `
            --force-reauth
          
          Start-Sleep -Seconds 10
          
          # احصل على الـ IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
                  $retries++
              }
          }
          
          if (-not $tsIP) {
              Write-Error "❌ Tailscale IP not assigned"
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "✅ Tailscale Connected - IP: $tsIP"
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "❌ TCP connection failed"
              exit 1
          }
          Write-Host "✅ TCP connectivity successful!"

      - name: Display Connection Info
        run: |
          Write-Host ""
          Write-Host "╔════════════════════════════════════════════╗"
          Write-Host "║       ✅ RDP جاهز للاتصال الآن!            ║"
          Write-Host "╚════════════════════════════════════════════╝"
          Write-Host ""
          Write-Host "📍 IP Address:    $env:TAILSCALE_IP"
          Write-Host "🔌 Port:          3389"
          Write-Host "👤 Username:      RDP"
          Write-Host "🔑 Password:      $env:RDP_CREDS"
          Write-Host ""
          Write-Host "⏱️  المدة: 5.5 ساعات"
          Write-Host "🔄 إعادة تشغيل تلقائية كل 5 ساعات"
          Write-Host ""

      - name: Maintain Connection (5.5 hours)
        run: |
          $endTime = (Get-Date).AddMinutes(330)
          $counter = 0
          
          while ((Get-Date) -lt $endTime) {
              $counter++
              $elapsed = [int]((Get-Date) - (Get-Date).AddMinutes(-330)).TotalMinutes
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ✅ RDP Active ($counter cycles)"
              Start-Sleep -Seconds 300
          }
          
          Write-Host ""
          Write-Host "⏰ انتهت جلسة العمل - سيتم إعادة التشغيل تلقائياً..."
          Write-Host ""
